# .github/workflows/engagement-harness.yml
# Generated by engagement-harness ci templates --platform github
name: Engagement Harness Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: PR Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Clone and build engagement-harness
        run: |
          git clone https://github.com/abhishikthmeesala-2000/harness-review.git /tmp/harness
          cd /tmp/harness
          pnpm install
          pnpm build
          cd packages/cli
          sed -i '/"private": true,/d' package.json
          pnpm link --global

      - name: Fetch base branch
        run: git fetch origin main:main

      - name: Run review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
        run: engagement-harness review --ci

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engagement-harness-reports
          path: .engagement-harness/reports/
